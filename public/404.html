<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>404 - Page Not Found | ARA Discover Marketing</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #f0f7ff 0%, #eff6ff 55%, #e0f2fe 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 480px;
        margin: 24px;
        padding: 48px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 28px;
        box-shadow: 0 24px 64px rgba(37, 99, 235, 0.14), 0 4px 16px rgba(0, 0, 0, 0.04);
      }
      .badge {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7c3aed;
        border: 1px solid #ddd6fe;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 16px;
      }
      p {
        font-size: 15px;
        color: #64748b;
        line-height: 1.7;
        margin: 0 0 28px;
      }
      a.btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Error 404</span>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or may have been moved.</p>
      <a class="btn" href="https://discovermarketing.co/">Back to Home</a>
    </div>
  </body>
</html>
